<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zalo → Nhật ký Ban Điện</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>Cầu nối Zalo → Nhật ký đang chạy</h1>
    <p>Không còn Kanban hoặc dữ liệu công việc local. Hãy mở <strong>chat.zalo.me</strong>, bôi đen tin giao việc và bấm <strong>Tạo việc</strong>.</p>
    <div id="health">Đang kiểm tra Ollama…</div>
    <a href="https://bandien.github.io/scan/nhatky/">Mở Nhật ký Ban Điện</a>
  </main>
  <script>fetch('/api/health').then(r=>r.json()).then(h=>{document.getElementById('health').textContent=h.ollama?'AI local sẵn sàng: '+h.model:'Cầu nối sẵn sàng, Ollama chưa chạy';}).catch(()=>{document.getElementById('health').textContent='Không kiểm tra được trạng thái';});</script>
</body>
</html>
